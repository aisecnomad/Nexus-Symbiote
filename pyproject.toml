[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nexus-symbiote"
version = "0.2.0"
description = "Agent Bill of Materials (AgentBOM) — generate, validate, and manage AIBOMs for production AI agent systems"
readme = "README.md"
license = "MIT AND Apache-2.0 AND Community-Spec-1.0 AND CC-BY-3.0"
license-files = [
    "LICENSE",
    "src/nexus_symbiote/generators/schemas/vendor/LICENSE-APACHE-2.0.txt",
    "src/nexus_symbiote/generators/schemas/vendor/LICENSE-SPDX-3.0.1.txt",
    "src/nexus_symbiote/generators/schemas/vendor/NOTICE.txt",
]
requires-python = ">=3.11"
authors = [
    { name = "Emmanuel Dahunsi" },
]
keywords = [
    "aibom",
    "sbom",
    "ai-security",
    "supply-chain",
    "cyclonedx",
    "spdx",
    "mcp",
    "agent-security",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
# Every lower bound is tested (requirements-floor.lock), with the extras and the build backend
# installed beside the core. So three floors are what those need, not what the core was shown
# to need: pydantic 2.12 (sigstore-models), jsonschema 4.25 (cyclonedx-python-lib's
# json-validation) and packaging 24.2 (hatchling 1.27). Lower versions are untested, not known
# to fail.
dependencies = [
    "click>=8.2.1,<9",
    "packaging>=24.2,<27",
    "packageurl-python>=0.17.6,<1",
    "pydantic>=2.12,<3",
    "rfc8785>=0.1.4,<0.2",
    "pyyaml>=6.0.1,<7",
    "jsonschema>=4.25,<5",
    "referencing>=0.35,<1",
    "cryptography>=50,<53",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
]

[project.optional-dependencies]
cyclonedx = [
    "cyclonedx-python-lib[json-validation]>=11.12,<12",
]
sigstore = [
    "sigstore>=4.4,<5",
    # Imported directly by utils/crypto.py, not only through sigstore.
    "sigstore-models>=0.0.6,<0.1",
    "tuf>=7,<8",
    "platformdirs>=4.2,<5",
]
all = [
    "nexus-symbiote[cyclonedx,sigstore]",
]

[project.scripts]
nexus-symbiote = "nexus_symbiote.cli:main"

[project.urls]
Homepage = "https://github.com/aisecnomad/Nexus-Symbiote"
Repository = "https://github.com/aisecnomad/Nexus-Symbiote"
Issues = "https://github.com/aisecnomad/Nexus-Symbiote/issues"
Documentation = "https://github.com/aisecnomad/Nexus-Symbiote/tree/main/docs"
Changelog = "https://github.com/aisecnomad/Nexus-Symbiote/blob/main/CHANGELOG.md"
Security = "https://github.com/aisecnomad/Nexus-Symbiote/blob/main/SECURITY.md"

[dependency-groups]
# Development tools only; never published. `make lock` resolves them with the
# `all` extra into requirements-ci.lock and pins them in requirements-floor.lock.
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=5.0,<8",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.4,<1",
    "mypy>=1.10,<3",
    "types-PyYAML>=6.0,<7",
    "types-jsonschema>=4.23,<5",
    "build>=1.2,<2",
    "twine>=6.0,<8",
    "hypothesis>=6.0,<7",
    "spdx-python-model>=0.0.6,<1",
    "hatchling>=1.27,<2",
    "editables>=0.5,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_symbiote"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
# README images are served from the repository by absolute URL; benchmarks are not build inputs.
exclude = ["/docs/assets", "/benchmarks/aibom-bench"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# PLE25xx: no literal bidirectional or invisible control character in source; write the
# escape. scripts/check_repository_hygiene.py covers the characters these rules do not.
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "S",
    "B",
    "A",
    "C4",
    "SIM",
    "PLE2502",
    "PLE2510",
    "PLE2512",
    "PLE2513",
    "PLE2514",
    "PLE2515",
]
ignore = ["S101", "UP042", "E501", "SIM102", "SIM105"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sigstore_models.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -p pytester"
# A test that runs longer fails with its traceback (tests/conftest.py); the thread dump
# comes first. CI sets a tighter limit. Mark a known slow test with
# @pytest.mark.timeout(seconds).
test_timeout = "300"
faulthandler_timeout = 120
xfail_strict = true

[tool.coverage.run]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
