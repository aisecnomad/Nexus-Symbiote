[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-symbiote"
version = "0.1.0"
description = "Agent Bill of Materials (AgentBOM) — generate, validate, and manage AIBOMs for production AI agent systems"
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = [
    "LICENSE",
    "src/nexus_symbiote/generators/schemas/vendor/LICENSE-APACHE-2.0.txt",
    "src/nexus_symbiote/generators/schemas/vendor/NOTICE.txt",
]
requires-python = ">=3.11"
authors = [
    { name = "Emmanuel Dahunsi", email = "immanueldahunsi@gmail.com" },
]
keywords = [
    "aibom",
    "sbom",
    "ai-security",
    "supply-chain",
    "cyclonedx",
    "spdx",
    "mcp",
    "agent-security",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1,<9",
    "packaging>=24,<27",
    "packageurl-python>=0.17.6,<1",
    "pydantic>=2.5,<3",
    "rich>=13.0,<16",
    "rfc8785>=0.1.4,<1",
    "pyyaml>=6.0.1,<7",
    "jsonschema>=4.23,<5",
    "referencing>=0.35,<1",
    "cryptography>=50,<51",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
]

[project.optional-dependencies]
cyclonedx = [
    "cyclonedx-python-lib[json-validation]>=11.12,<12",
]
sigstore = [
    "sigstore>=4.4,<5",
    "tuf>=7,<8",
]
yaml = [
    "pyyaml>=6.0.1,<7",
]
all = [
    "cyclonedx-python-lib[json-validation]>=11.12,<12",
    "sigstore>=4.4,<5",
    "tuf>=7,<8",
    "pyyaml>=6.0.1,<7",
]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=5.0,<8",
    "ruff>=0.4,<1",
    "mypy>=1.10,<3",
    "types-PyYAML>=6.0,<7",
    "types-jsonschema>=4.23,<5",
    "sigstore>=4.4,<5",
    "tuf>=7,<8",
    "build>=1.2,<2",
    "twine>=6.0,<8",
    "hypothesis>=6.0,<7",
    "spdx-python-model>=0.0.6,<1",
    "cyclonedx-python-lib[json-validation]>=11.12,<12",
    "hatchling>=1.25,<2",
    "editables>=0.5,<1",
]

[project.scripts]
nexus-symbiote = "nexus_symbiote.cli:main"

[project.urls]
Homepage = "https://github.com/Hunzee-VC/Nexus-Symbiote"
Repository = "https://github.com/Hunzee-VC/Nexus-Symbiote"
Issues = "https://github.com/Hunzee-VC/Nexus-Symbiote/issues"
Documentation = "https://github.com/Hunzee-VC/Nexus-Symbiote/tree/main/docs"
Changelog = "https://github.com/Hunzee-VC/Nexus-Symbiote/blob/main/CHANGELOG.md"
Security = "https://github.com/Hunzee-VC/Nexus-Symbiote/blob/main/SECURITY.md"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_symbiote"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
# README images are served from the repository by absolute URL; they are not build inputs.
exclude = ["/docs/assets"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM"]
ignore = ["S101", "UP042", "E501", "SIM102", "SIM105"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
