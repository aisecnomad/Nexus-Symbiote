name: Release candidate and approved publication
on:
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Upload the verified wheel and sdist: none (candidate only), testpypi
          (rehearsal on test.pypi.org) or pypi
        type: choice
        required: true
        default: none
        options:
          - none
          - testpypi
          - pypi
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      distributions_id: ${{ steps.distributions.outputs.artifact-id }}
      evidence_id: ${{ steps.evidence.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install locked release checks
        run: |
          python -m pip install --require-hashes -r requirements-ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Require enforced repository review controls before publication
        if: inputs.publish != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_repository_controls.py --repo "$GITHUB_REPOSITORY" --branch main --sha "$GITHUB_SHA"
      # Build first, from an export of the checked-out commit: no file that a
      # later test or evidence step writes into the workspace can reach the sdist.
      - name: Export the checked-out commit for a clean, reproducible build
        run: |
          set -euo pipefail
          git archive --format=tar --prefix=release-source/ HEAD | tar -xf - -C "$RUNNER_TEMP"
          printf 'SOURCE_DATE_EPOCH=%s\n' "$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Build distributions with the locked backend
        working-directory: ${{ runner.temp }}/release-source
        run: python -m build --no-isolation
      - name: Stage exactly one wheel and one sdist
        run: |
          set -euo pipefail
          mkdir dist
          cp "$RUNNER_TEMP"/release-source/dist/* dist/
          test "$(find dist -name 'nexus_symbiote-*-py3-none-any.whl' | wc -l)" -eq 1
          test "$(find dist -name 'nexus_symbiote-*.tar.gz' | wc -l)" -eq 1
          test "$(find dist -type f | wc -l)" -eq 2
          sha256sum dist/* > "$RUNNER_TEMP/distributions.sha256"
      - run: python -m twine check --strict dist/*
      # Upload before any step resolves or runs unpinned dependencies. The attest
      # and publish jobs use these bytes, which later steps here cannot change.
      - name: Upload distributions
        id: distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
      - name: Recheck candidate dependencies against current OSV advisories
        run: python scripts/check_dependency_advisories.py --out evidence/dependency-advisories.json
      - run: python -m pytest
      - name: Enforce committed security regression contracts
        run: python scripts/check_security_regressions.py --out evidence/security-regressions.json
      - name: Retain candidate security reports on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-security-regression-evidence
          path: |
            evidence/security-regressions.json
            evidence/dependency-advisories.json
          if-no-files-found: warn
      - run: ruff check src tests scripts && ruff format --check src tests scripts
      - run: mypy src/nexus_symbiote scripts
      - run: python scripts/check_workflows.py
      - name: Run security acceptance against the exact built wheel
        run: |
          python -m pip install --no-index --no-deps --force-reinstall dist/*.whl
          python -I scripts/check_wheel_security.py dist/*.whl
      - name: Collect release evidence with the locked wheel runtime
        run: |
          python -m venv "$RUNNER_TEMP/release-smoke"
          "$RUNNER_TEMP/release-smoke/bin/python" -m pip install --require-hashes --only-binary=:all: -r requirements-action.lock
          "$RUNNER_TEMP/release-smoke/bin/python" -m pip install --no-index --no-deps dist/*.whl
          "$RUNNER_TEMP/release-smoke/bin/python" -m pip check
          mkdir -p evidence
          "$RUNNER_TEMP/release-smoke/bin/python" -m pip inspect > evidence/installed-distributions.json
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/release-smoke/bin/python" -m nexus_symbiote --version
          "$RUNNER_TEMP/release-smoke/bin/python" -m nexus_symbiote scan "$GITHUB_WORKSPACE" --report-only -f cyclonedx -o "$GITHUB_WORKSPACE/evidence/project.cdx.json"
      - name: Write the CycloneDX SBOM of the locked wheel runtime
        run: python scripts/environment_sbom.py evidence/installed-distributions.json --out evidence/environment.cdx.json
      - name: Package the installed wheel's inventory benchmark
        run: |
          # Evidence below is derived from dist/; fail closed unless it still holds
          # exactly the bytes that were uploaded before any test or install ran.
          sha256sum --strict -c "$RUNNER_TEMP/distributions.sha256"
          "$RUNNER_TEMP/release-smoke/bin/python" benchmarks/inventory/evidence.py prepare "$RUNNER_TEMP/inventory-benchmark"
          sha256sum dist/*.whl > "$RUNNER_TEMP/inventory-benchmark/wheel.sha256"
          tar -C "$RUNNER_TEMP/inventory-benchmark" -czf evidence/inventory-benchmark.tar.gz results.json statement.json wheel.sha256
          python scripts/release_checksums.py
          tar -C "$GITHUB_WORKSPACE" -czf "$RUNNER_TEMP/release-evidence.tar.gz" evidence
          mv "$RUNNER_TEMP/release-evidence.tar.gz" evidence/release-evidence.tar.gz
      - name: Upload SBOM and checksums
        id: evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence
          path: evidence/*
          if-no-files-found: error
  compatibility:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.distributions_id || 'missing' }}
          path: dist
          digest-mismatch: error
      - name: Test the wheel against its public dependency ranges
        run: |
          python -m venv "$RUNNER_TEMP/compatibility"
          python_bin="$RUNNER_TEMP/compatibility/bin/python"
          "$python_bin" -m pip install dist/*.whl
          "$python_bin" -m pip check
          mkdir "$RUNNER_TEMP/sample"
          printf 'Use read-only tools.\n' > "$RUNNER_TEMP/sample/AGENTS.md"
          "$python_bin" -I -m nexus_symbiote --version
          "$python_bin" -I -m nexus_symbiote scan "$RUNNER_TEMP/sample" --report-only -f cyclonedx -o "$RUNNER_TEMP/sample.cdx.json"
  attest:
    needs: [build, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      distribution_attestation_id: ${{ steps.distribution-attestation.outputs.artifact-id }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.distributions_id || 'missing' }}
          path: dist
          digest-mismatch: error
      - name: Attest distribution provenance
        id: distributions
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Retain distribution attestation bundle
        id: distribution-attestation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution-attestation
          path: ${{ steps.distributions.outputs.bundle-path }}
          if-no-files-found: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.evidence_id || 'missing' }}
          path: evidence
          digest-mismatch: error
      - name: Attest the complete candidate evidence bundle
        id: candidate-evidence
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: evidence/release-evidence.tar.gz
      - name: Retain candidate evidence attestation bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-attestation
          path: ${{ steps.candidate-evidence.outputs.bundle-path }}
          if-no-files-found: error
      - name: Attest inventory benchmark results and wheel digest
        id: inventory
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: evidence/inventory-benchmark.tar.gz
      - name: Retain inventory attestation bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inventory-benchmark-attestation
          path: ${{ steps.inventory.outputs.bundle-path }}
          if-no-files-found: error
  verify:
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Verification runs shell and a token-bearing CLI, so it stays out of the
    # OIDC-holding jobs; publish depends on it and remains shell-free.
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.distributions_id || 'missing' }}
          path: dist
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.attest.outputs.distribution_attestation_id || 'missing' }}
          path: attestation
          digest-mismatch: error
      - name: Verify exact distributions and source provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          bundles=(attestation/*)
          (( ${#bundles[@]} == 1 ))
          test -s "${bundles[0]}"
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          everything=(dist/*)
          (( ${#wheels[@]} == 1 && ${#sdists[@]} == 1 && ${#everything[@]} == 2 ))
          for artifact in "${everything[@]}"; do
            [[ -f "$artifact" && ! -L "$artifact" ]]
          done
          for artifact in "${wheels[@]}" "${sdists[@]}"; do
            gh attestation verify "$artifact" \
              --bundle "${bundles[0]}" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref refs/heads/main --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
  publish:
    if: inputs.publish != 'none' && github.ref == 'refs/heads/main'
    needs: [build, attest, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment is named after the index: each index's trusted publisher
    # accepts only this workflow file and its own environment.
    environment:
      name: ${{ inputs.publish }}
      url: ${{ inputs.publish == 'testpypi' && 'https://test.pypi.org/p/nexus-symbiote' || 'https://pypi.org/p/nexus-symbiote' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.distributions_id || 'missing' }}
          path: dist
          digest-mismatch: error
      - name: Publish with OIDC trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
          repository-url: ${{ inputs.publish == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
