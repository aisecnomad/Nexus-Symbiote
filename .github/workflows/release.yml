name: Release candidate and approved publication
on:
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Upload the verified wheel and sdist: none (candidate only), testpypi
          (rehearsal on test.pypi.org) or pypi
        type: choice
        required: true
        default: none
        options:
          - none
          - testpypi
          - pypi
      soak_override:
        description: >-
          Leave empty. Publishing to PyPI requires the release commit to have been on
          main for 24 hours; to publish an urgent security fix sooner, state why here.
          The reason is printed in the run log.
        type: string
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      distributions_id: ${{ steps.distributions.outputs.artifact-id }}
      evidence_id: ${{ steps.evidence.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install locked release checks
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Require branch protection, exact-source CI and the publication prerequisites
        if: inputs.publish != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
          SOAK_OVERRIDE: ${{ inputs.soak_override }}
          # Optional comma-separated tagger emails; unset means no allowlist.
          ALLOWED_RELEASE_TAG_SIGNERS: ${{ vars.ALLOWED_RELEASE_TAG_SIGNERS }}
        run: >-
          python scripts/check_repository_controls.py --repo "$GITHUB_REPOSITORY"
          --branch main --sha "$GITHUB_SHA" --publish "$PUBLISH"
      # Build first, from an export of the checked-out commit: no file that a
      # later test or evidence step writes into the workspace can reach the sdist.
      - name: Export the checked-out commit for a clean, reproducible build
        run: |
          set -euo pipefail
          git archive --format=tar --prefix=release-source/ HEAD | tar -xf - -C "$RUNNER_TEMP"
          printf 'SOURCE_DATE_EPOCH=%s\n' "$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Build distributions with the locked backend
        working-directory: ${{ runner.temp }}/release-source
        run: python -m build --no-isolation
      - name: Stage exactly one wheel and one sdist
        run: |
          set -euo pipefail
          mkdir dist
          cp "$RUNNER_TEMP"/release-source/dist/* dist/
          test "$(find dist -name 'nexus_symbiote-*-py3-none-any.whl' | wc -l)" -eq 1
          test "$(find dist -name 'nexus_symbiote-*.tar.gz' | wc -l)" -eq 1
          test "$(find dist -type f | wc -l)" -eq 2
          sha256sum dist/* > "$RUNNER_TEMP/distributions.sha256"
      - run: python -m twine check --strict dist/*
      # Upload before any step resolves or runs unpinned dependencies. The attest
      # and publish jobs use these bytes, which later steps here cannot change.
      - name: Upload distributions
        id: distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 90
      - name: Recheck candidate dependencies against current OSV advisories
        run: >-
          python scripts/check_dependency_advisories.py
          --lock requirements-ci.lock --lock requirements-action.lock --lock requirements-floor.lock
          --out evidence/dependency-advisories.json
      # Every run builds the image here, before anything is attested or published, with the
      # script the image job runs again before it pushes: a Dockerfile, lock or base that
      # cannot produce a working image stops the candidate, not a release already on PyPI.
      # No registry is logged in to and nothing is pushed. It runs before the suite, like the
      # advisory recheck: both need a service outside the runner and should fail early.
      - name: Build and check the container image from the staged wheel and record its base packages
        run: |
          sha256sum --strict -c "$RUNNER_TEMP/distributions.sha256"
          python -I -S scripts/check_image.py dist --packages-out evidence/image-packages.json
          python scripts/image_base_updates.py evidence/image-packages.json --out evidence/image-base-updates.json
      - run: python -m pytest -n auto --dist worksteal --strict-skips
      - name: Enforce committed security regression contracts
        run: python scripts/check_security_regressions.py --out evidence/security-regressions.json
      - name: Retain candidate security reports, including on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-security-regression-evidence
          path: |
            evidence/security-regressions.json
            evidence/dependency-advisories.json
          if-no-files-found: warn
          retention-days: 90
      - run: ruff check src tests scripts && ruff format --check src tests scripts
      - run: mypy src/nexus_symbiote scripts
      - run: python scripts/check_workflows.py
      - name: Run security acceptance against the exact built wheel
        run: |
          python -m pip install --only-binary=:all: --no-index --no-deps --force-reinstall dist/*.whl
          python -I scripts/check_wheel_security.py dist/*.whl
      - name: Collect release evidence with the locked wheel runtime
        run: |
          python -m venv "$RUNNER_TEMP/release-smoke"
          "$RUNNER_TEMP/release-smoke/bin/python" -m pip install --require-hashes --only-binary=:all: -r requirements-action.lock
          "$RUNNER_TEMP/release-smoke/bin/python" -m pip install --only-binary=:all: --no-index --no-deps dist/*.whl
          "$RUNNER_TEMP/release-smoke/bin/python" -m pip check
          mkdir -p evidence
          "$RUNNER_TEMP/release-smoke/bin/python" -m pip inspect > evidence/installed-distributions.json
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/release-smoke/bin/python" -m nexus_symbiote --version
          "$RUNNER_TEMP/release-smoke/bin/python" -m nexus_symbiote scan "$GITHUB_WORKSPACE" --report-only -f cyclonedx -o "$GITHUB_WORKSPACE/evidence/project.cdx.json"
      - name: Write the CycloneDX SBOM of the locked wheel runtime
        run: >-
          python scripts/environment_sbom.py evidence/installed-distributions.json
          --lock requirements-action.lock --out evidence/environment.cdx.json
      - name: Package the installed wheel's inventory benchmark
        run: |
          # Evidence below is derived from dist/; fail closed unless the staged files still
          # hold the bytes that were uploaded before any test or install ran.
          sha256sum --strict -c "$RUNNER_TEMP/distributions.sha256"
          "$RUNNER_TEMP/release-smoke/bin/python" benchmarks/inventory/evidence.py prepare "$RUNNER_TEMP/inventory-benchmark"
          sha256sum dist/*.whl > "$RUNNER_TEMP/inventory-benchmark/wheel.sha256"
          tar -C "$RUNNER_TEMP/inventory-benchmark" -czf evidence/inventory-benchmark.tar.gz results.json statement.json wheel.sha256
          python scripts/release_checksums.py
          tar -C "$GITHUB_WORKSPACE" -czf "$RUNNER_TEMP/release-evidence.tar.gz" evidence
          mv "$RUNNER_TEMP/release-evidence.tar.gz" evidence/release-evidence.tar.gz
      - name: Upload SBOM and checksums
        id: evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence
          path: evidence/*
          if-no-files-found: error
          retention-days: 90
  compatibility:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.distributions_id || 'missing' }}
          path: dist
          digest-mismatch: error
      - name: Test the wheel against its public dependency ranges
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/compatibility"
          python_bin="$RUNNER_TEMP/compatibility/bin/python"
          "$python_bin" -m pip install --only-binary=:all: dist/*.whl
          "$python_bin" -m pip check
          "$python_bin" -m pip freeze --all
          mkdir "$RUNNER_TEMP/source"
          tar --no-same-owner --strip-components=1 -xzf dist/nexus_symbiote-*.tar.gz -C "$RUNNER_TEMP/source"
          "$python_bin" -I "$RUNNER_TEMP/source/scripts/check_installed_wheel.py" --source "$RUNNER_TEMP/source"
  attest:
    needs: [build, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      distribution_attestation_id: ${{ steps.distribution-attestation.outputs.artifact-id }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.distributions_id || 'missing' }}
          path: dist
          digest-mismatch: error
      - name: Attest distribution provenance
        id: distributions
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Retain distribution attestation bundle
        id: distribution-attestation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution-attestation
          path: ${{ steps.distributions.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.evidence_id || 'missing' }}
          path: evidence
          digest-mismatch: error
      - name: Attest the complete candidate evidence bundle
        id: candidate-evidence
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: evidence/release-evidence.tar.gz
      - name: Retain candidate evidence attestation bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-attestation
          path: ${{ steps.candidate-evidence.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90
      - name: Attest inventory benchmark results and wheel digest
        id: inventory
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: evidence/inventory-benchmark.tar.gz
      - name: Retain inventory attestation bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inventory-benchmark-attestation
          path: ${{ steps.inventory.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90
  verify:
    needs: [build, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Verification runs shell and a token-bearing CLI, so it stays out of the
    # OIDC-holding jobs; publish depends on it and remains shell-free.
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.distributions_id || 'missing' }}
          path: dist
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.attest.outputs.distribution_attestation_id || 'missing' }}
          path: attestation
          digest-mismatch: error
      - name: Verify exact distributions and source provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          bundles=(attestation/*)
          (( ${#bundles[@]} == 1 )) || exit 1
          test -s "${bundles[0]}" || exit 1
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          everything=(dist/*)
          (( ${#wheels[@]} == 1 && ${#sdists[@]} == 1 && ${#everything[@]} == 2 )) || exit 1
          for artifact in "${everything[@]}"; do
            [[ -f "$artifact" && ! -L "$artifact" ]] || exit 1
          done
          for artifact in "${wheels[@]}" "${sdists[@]}"; do
            gh attestation verify "$artifact" \
              --bundle "${bundles[0]}" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref refs/heads/main --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
  publish:
    if: inputs.publish != 'none' && github.ref == 'refs/heads/main'
    needs: [build, attest, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The environment is named after the index: each index's trusted publisher
    # accepts only this workflow file and its own environment.
    environment:
      name: ${{ inputs.publish }}
      url: ${{ inputs.publish == 'testpypi' && 'https://test.pypi.org/p/nexus-symbiote' || 'https://pypi.org/p/nexus-symbiote' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.distributions_id || 'missing' }}
          path: dist
          digest-mismatch: error
      - name: Publish with OIDC trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
          repository-url: ${{ inputs.publish == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
  # The image of the published wheel on the hash-locked Action runtime, pushed for PyPI
  # releases only: every other run stops at the build job's unpushed image. The job holds no
  # OIDC token; image-attest, which runs no shell, signs the digest it pushed.
  image:
    if: inputs.publish == 'pypi' && github.ref == 'refs/heads/main'
    needs: [build, verify, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: pypi
    permissions:
      contents: read
      packages: write
    outputs:
      name: ${{ steps.push.outputs.name }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.distributions_id || 'missing' }}
          path: dist
          digest-mismatch: error
      # The build job's image check, again, on the verified wheel. This step holds no token and
      # uses the runner's own Python: the script needs only the standard library, and every
      # run of it passes -S so that an import of anything else fails before publication.
      - name: Build the verified wheel's image and run it offline
        id: build
        shell: bash
        run: |
          set -euo pipefail
          name="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          python3 -I -S scripts/check_image.py dist --name "$name" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - name: Push the image that ran offline
        id: push
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.build.outputs.name }}
          VERSION: ${{ steps.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          expected="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          [[ "$IMAGE" == "$expected" ]] || exit 1
          [[ "$VERSION" =~ ^[0-9][0-9A-Za-z._]*$ ]] || exit 1
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Sign the pushed manifest using Docker's receipt for this push.
          receipt="$RUNNER_TEMP/image-push.log"
          docker push "$IMAGE:$VERSION" | tee "$receipt"
          digest="$(awk -v tag="$VERSION:" '$1 == tag && $2 == "digest:" && $4 == "size:" {print $3}' "$receipt")"
          docker logout ghcr.io
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          printf 'name=%s\ndigest=%s\n' "$IMAGE" "$digest" >> "$GITHUB_OUTPUT"
          printf 'Pushed %s@%s\n' "$IMAGE" "$digest" | tee -a "$GITHUB_STEP_SUMMARY"
  image-attest:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Attest the pushed image digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.image.outputs.name }}
          subject-digest: ${{ needs.image.outputs.digest }}
  # Runs shell with a registry token, so it stays out of the OIDC-holding job.
  image-verify:
    needs: [image, image-attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
      packages: read
    steps:
      - name: Verify the pushed image digest and its source provenance
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.image.outputs.name }}
          DIGEST: ${{ needs.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          expected="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          [[ "$IMAGE" == "$expected" ]] || exit 1
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          gh attestation verify "oci://$IMAGE@$DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref refs/heads/main --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
