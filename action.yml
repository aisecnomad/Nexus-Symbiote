name: Nexus SymBiote AgentBOM Scanner
description: Collect one agent inventory, validate it, and export reviewable supply-chain evidence
branding:
  icon: shield
  color: blue
# Operator binding key. The collector reads NEXUS_SYMBIOTE_SOURCE_BINDING_KEY from the
# environment; it is not an input. Generate a random key of at least 64 hexadecimal
# characters once, never a passphrase, for example with
#   python -c 'import secrets; print(secrets.token_hex(32))'
# store it as a repository secret, and pass it to this Action as step-level env:
#   - uses: Hunzee-VC/Nexus-Symbiote@<reviewed-40-character-commit-sha>
#     env:
#       NEXUS_SYMBIOTE_SOURCE_BINDING_KEY: ${{ secrets.NEXUS_SYMBIOTE_SOURCE_BINDING_KEY }}
# Without a valid key, A2A declarations are partial coverage and the validate and
# risk gates fail. Pull requests from forks receive no secrets, so in a repository
# with A2A declarations their runs fail closed.
inputs:
  scan-path:
    description: Project directory within the checked-out workspace
    default: "."
  format:
    description: "Output format: json, cyclonedx, spdx, sarif"
    default: json
  output-file:
    description: Output path within the workspace
    default: nexus-symbiote-aibom.json
  scanners:
    description: Comma-separated scanner names including shadowscan, a2a, ide_agents; empty means all
    default: ""
  validate:
    description: Fail the action when completeness or integrity validation fails
    default: "true"
  risk-check:
    description: Apply the risk policy gate
    default: "true"
  risk-threshold:
    description: Risk gate threshold from 0 to 100; 0 explicitly disables this gate
    default: "50"
  sarif-upload:
    description: Generate SARIF and upload it with security-events write permission
    default: "false"
  python-version:
    description: Python version for the scanner
    default: "3.12"
outputs:
  aibom-path:
    description: Path to the requested export
    value: ${{ steps.scan.outputs.aibom_path }}
  risk-score:
    description: Numeric score, empty when the gate produced no valid report
    value: ${{ steps.scan.outputs.risk_score }}
  risk-passed:
    description: Whether the risk gate passed; true, false, or skipped
    value: ${{ steps.scan.outputs.passed }}
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install reviewed Action source
      shell: bash
      env:
        SYMBIOTE_ACTION_PATH: ${{ github.action_path }}
      run: |
        action_venv="$(mktemp -d "$RUNNER_TEMP/nexus-symbiote-action-XXXXXX")"
        python -I -m venv "$action_venv"
        "$action_venv/bin/python" -I -m pip install --require-hashes --only-binary=:all: -r "$SYMBIOTE_ACTION_PATH/requirements-action.lock"
        "$action_venv/bin/python" -I -m pip install --no-deps --no-build-isolation -- "$SYMBIOTE_ACTION_PATH"
        echo "$action_venv/bin" >> "$GITHUB_PATH"
    - name: Collect once and apply validation gates
      id: scan
      shell: bash
      env:
        SYMBIOTE_ACTION_PATH: ${{ github.action_path }}
        SYMBIOTE_SCAN_PATH: ${{ inputs.scan-path }}
        SYMBIOTE_FORMAT: ${{ inputs.format }}
        SYMBIOTE_OUTPUT_FILE: ${{ inputs.output-file }}
        SYMBIOTE_SCANNERS: ${{ inputs.scanners }}
        SYMBIOTE_VALIDATE: ${{ inputs.validate }}
        SYMBIOTE_RISK_CHECK: ${{ inputs.risk-check }}
        SYMBIOTE_RISK_THRESHOLD: ${{ inputs.risk-threshold }}
        SYMBIOTE_SARIF: ${{ inputs.sarif-upload }}
      run: python -I "$SYMBIOTE_ACTION_PATH/scripts/run_action.py"
    - name: Upload SARIF
      if: inputs.sarif-upload == 'true' && always() && steps.scan.outputs.sarif_path != ''
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
      with:
        sarif_file: ${{ steps.scan.outputs.sarif_path }}
        category: nexus_symbiote
    - name: Upload evidence artifacts
      if: always() && steps.scan.outputs.aibom_path != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: nexus-symbiote-aibom
        path: |
          ${{ steps.scan.outputs.aibom_path }}
          ${{ steps.scan.outputs.sarif_path }}
        if-no-files-found: error
